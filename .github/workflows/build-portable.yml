name: Portable Windows build

# Builds the portable .exe whenever the toolkit source (or the build system)
# changes, and publishes a GitHub Release named after the version in the source.
on:
  push:
    branches: [main]
    paths:
      - "files/Backup_Restore_Toolkit.py"
      - "build/**"
      - ".github/workflows/build-portable.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "files/Backup_Restore_Toolkit.py"
      - "build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Read version from source
        id: version
        run: |
          version=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            files/Backup_Restore_Toolkit.py | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No VERSION line found in files/Backup_Restore_Toolkit.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected version $version"

      - name: Cache Windows Python runtime
        uses: actions/cache@v4
        with:
          path: |
            build/.cache/winpy
            build/.cache/micromamba
            build/.cache/mm-root
          key: winpy-${{ runner.os }}-${{ hashFiles('build/build_portable.py') }}

      - name: Build portable exe
        run: python3 build/build_portable.py --toolchain /usr

      - name: Checksums
        run: |
          cd dist
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="v$VERSION"

          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag $REF_NAME does not match VERSION $VERSION in the source."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - replacing its files."
            gh release upload "$tag" dist/*.exe dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" \
              dist/*.exe dist/*.zip dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Backup & Restore Toolkit $VERSION" \
              --notes "Portable Windows build of version $VERSION.

          - \`Backup_Restore_Toolkit_${VERSION}_Portable.exe\` - single file, no Python needed
          - \`Backup_Restore_Toolkit_${VERSION}_Portable.zip\` - same bundle, unzip and run \`Run Toolkit.bat\`
          - \`SHA256SUMS.txt\` - checksums for both

          The exe is not code-signed, so Windows SmartScreen may ask you to confirm the first run (More info -> Run anyway)."
          fi
