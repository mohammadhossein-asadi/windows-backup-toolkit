name: Portable Windows build

on:
  push:
    branches: [main]
    paths:
      - "files/Backup_Restore_Toolkit.py"
      - "files/Backup_Restore_Toolkit_v3.1.0.py"
      - "files/Backup_Restore_Toolkit.pyw"
      - "build/**"
      - ".github/workflows/build-portable.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CACHE_DIR: ${{ github.workspace }}/build/.cache

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 ca-certificates

      - name: Cache portable Python runtime and toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CACHE_DIR }}
          key: portable-runtime-${{ runner.os }}-${{ hashFiles('build/build_portable.py') }}

      - name: Build portable exe
        run: |
          python3 build/build_portable.py --toolchain /usr --cache-dir "$CACHE_DIR" --dist-dir dist

      - name: Verify portable payload
        run: |
          ls -lh dist
          unzip -l dist/Backup_Restore_Toolkit_3.1.0_Portable.zip | tail -n 20

      - name: Upload portable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Backup_Restore_Toolkit_3.1.0_Portable
          path: |
            dist/Backup_Restore_Toolkit_3.1.0_Portable.exe
            dist/Backup_Restore_Toolkit_3.1.0_Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=3.1.0
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/Backup_Restore_Toolkit_3.1.0_Portable.exe \
              dist/Backup_Restore_Toolkit_3.1.0_Portable.zip \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              dist/Backup_Restore_Toolkit_3.1.0_Portable.exe \
              dist/Backup_Restore_Toolkit_3.1.0_Portable.zip \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Backup & Restore Toolkit $TAG" \
              --notes "Portable Windows build for the checked-in toolkit version $VERSION."
          fi
